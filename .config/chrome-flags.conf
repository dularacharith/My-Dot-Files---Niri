# Chrome flags for Linux / Wayland
# Configures smooth scrolling and scales down touchpad scroll speed

# Enable smooth scrolling animations
--enable-smooth-scrolling

# Ozone Wayland backend
--ozone-platform=wayland

# Scale down Wayland touchpad scroll delta (0.35 = ~35% speed for controlled, smooth scrolling)
# To adjust: decrease factor (e.g. 0.25) to make it even slower, or increase (e.g. 0.5) to make it faster
--enable-features=WaylandTouchpadUnscaledScrolling:scroll_scaling_factor/0.35,TouchpadOverscrollHistoryNavigation,PercentBasedScrolling,SmoothScrolling
