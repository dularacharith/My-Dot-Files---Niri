# Chrome flags for Linux / Wayland (Intel Iris Xe)
# Optimized for smooth, lag-free scrolling and full GPU hardware acceleration

# Native Wayland backend
--ozone-platform-hint=auto
--ozone-platform=wayland

# Hardware GPU acceleration & rasterization
# (Eliminates CPU rasterization bottleneck for complex web apps like WhatsApp Web)
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy

# VA-API Hardware video decoding (Intel Iris Xe)
--enable-features=TouchpadOverscrollHistoryNavigation,VaapiVideoDecodeLinuxGL,VaapiVideoDecoder

# Disable synthetic software smooth scrolling
# On Wayland, touchpads already provide 1:1 kinetic scrolling via libinput.
# Synthetic smooth scrolling causes input lag, stutter, and DOM virtualization glitches in WhatsApp Web.
--disable-smooth-scrolling
--disable-features=SmoothScrolling,PercentBasedScrolling
