<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Default sans-serif font -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Display</string>
    </edit>
  </match>

  <!-- Default system-ui font -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Display</string>
    </edit>
  </match>

  <!-- Apple web font aliases -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Display</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Display</string>
    </edit>
  </match>

  <!-- Sinhala language preference: when lang is 'si', prioritize Sinhala Sangam MN -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>si</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Sinhala Sangam MN</string>
    </edit>
  </match>

  <!-- Map common Sinhala font names to Sinhala Sangam MN -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Sans Sinhala</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Sinhala Sangam MN</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Noto Serif Sinhala</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Sinhala Sangam MN</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Iskoola Pota</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Sinhala Sangam MN</string>
    </edit>
  </match>

  <!-- Fallback preferences -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Display</family>
      <family>SF Pro Text</family>
      <family>Sinhala Sangam MN</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>SF Pro Display</family>
      <family>SF Pro Text</family>
      <family>Sinhala Sangam MN</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Sinhala Sangam MN</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Sinhala Sangam MN</family>
    </prefer>
  </alias>


  <!-- Elevate default sans-serif and system-ui weight to Medium for SF Pro -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <test name="weight" qual="all" compare="not_eq">
      <const>bold</const>
    </test>
    <edit name="weight" mode="assign">
      <const>medium</const>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <test name="weight" qual="all" compare="not_eq">
      <const>bold</const>
    </test>
    <edit name="weight" mode="assign">
      <const>medium</const>
    </edit>
  </match>

</fontconfig>
