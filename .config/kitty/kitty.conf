# Font Configuration
font_size 12.0

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration (Hyprland-style animations)
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_bar_margin_height   2.5 1.5
tab_bar_margin_color    #121118
tab_bar_background      #121118
active_tab_foreground   #121118
active_tab_background   #c084fc
active_tab_font_style   bold
inactive_tab_foreground #938f99
inactive_tab_background #1a1823
inactive_tab_font_style normal
tab_activity_symbol     " ● "
tab_title_template      "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"

# Shell integration
shell_integration enabled

# Modern dark cyber color palette matching CharithD theme (independent of system light mode)
background            #121118
foreground            #e6e0e9
cursor                #38bdf8
cursor_text_color     #121118
selection_background  #4a3b69
selection_foreground  #ffffff
url_color             #38bdf8

